name: Validate Shipping Policy Preview (BUILD ONLY)
on:
  push:
    branches:
      - feat/shipping-reassignment-preview-only-20261102
permissions:
  contents: read
jobs:
  build-no-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Compile React (no Azure deployment)
        env:
          CI: 'false'
        run: npm run build
